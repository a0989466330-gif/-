</div>

<!DOCTYPE html><html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ระบบตรวจสอบข้อมูลสมาชิก</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Tahoma,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:#fff;
}

.hidden{
display:none !important;
}

.card{
width:100%;
max-width:1100px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
border-radius:30px;
padding:40px;
box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.logo{
font-size:42px;
font-weight:bold;
margin-bottom:15px;
text-align:center;
}

.subtitle{
text-align:center;
opacity:.85;
margin-bottom:25px;
}

.login-box{
text-align:center;
}

.password-input{
width:280px;
padding:16px;
border:none;
border-radius:15px;
font-size:20px;
text-align:center;
outline:none;
margin-top:15px;
}

.login-btn{
margin-top:15px;
padding:14px 40px;
border:none;
border-radius:15px;
background:#22c55e;
color:#fff;
font-size:18px;
cursor:pointer;
}

.login-btn:hover{
background:#16a34a;
}

.error{
margin-top:15px;
color:#ff9c9c;
}

.profile{
display:grid;
grid-template-columns:320px 1fr;
gap:30px;
align-items:start;
}

.left-panel{
text-align:center;
}

.avatar{
width:260px;
height:260px;
border-radius:50%;
object-fit:cover;
border:6px solid #fff;
box-shadow:0 0 30px rgba(255,255,255,.3);
}

.member-name{
margin-top:15px;
font-size:28px;
font-weight:bold;
}

.status{
margin-top:15px;
padding:12px;
border-radius:15px;
font-weight:bold;
font-size:18px;
}

.pass{
background:#16a34a;
}

.pending{
background:#eab308;
color:#111;
}

.fail{
background:#dc2626;
}

.info-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.info-box{
background:rgba(255,255,255,.08);
padding:18px;
border-radius:18px;
}

.label{
font-size:13px;
opacity:.8;
margin-bottom:8px;
}

.value{
font-size:18px;
font-weight:600;
}

.countdown{
margin-top:20px;
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.logout{
margin-top:25px;
padding:14px 35px;
border:none;
border-radius:15px;
background:#ef4444;
color:#fff;
cursor:pointer;
font-size:16px;
}

.logout:hover{
background:#dc2626;
}

@media(max-width:850px){

.profile{
grid-template-columns:1fr;
}

.avatar{
width:220px;
height:220px;
}

}

</style></head><body><div class="card" id="loginPage"><div class="logo">
🔐 ระบบตรวจสอบข้อมูลสมาชิก
</div><div class="subtitle">
กรอกรหัสสมาชิก 6 หลักเพื่อดูข้อมูลส่วนตัว
</div><div class="login-box"><input
type="password"
id="password"
maxlength="6"
placeholder="กรอกรหัส 6 หลัก"
class="password-input">

<br><button class="login-btn" onclick="login()">
เข้าสู่ระบบ
</button><div id="error" class="error"></div></div></div><div class="card hidden" id="profilePage"><div class="profile"><div class="left-panel"><img id="memberImage"
class="avatar"
src="member1.jpg">

<div id="memberName"
class="member-name">
-
</div><div id="memberStatus"
class="status">
-
</div><button class="logout"
onclick="logout()">
ออกจากระบบ
</button>

</div><div><div class="info-grid"><div class="info-box">
<div class="label">เลขประจำตัวสมาชิก</div>
<div class="value" id="memberId">-</div>
</div><div class="info-box">
<div class="label">วันเกิด</div>
<div class="value" id="birthday">-</div>
</div><div class="info-box">
<div class="label">คะแนน</div>
<div class="value" id="score">-</div>
</div><div class="info-box">
<div class="label">ที่อยู่อาศัย</div>
<div class="value" id="address">-</div>
</div></div><div class="countdown">
⏳ เวลาคงเหลือ :
<span id="countdown"></span>
</div></div></div></div><script>

const users = {

"123456":{
memberId:"MB001",
name:"<เกล> ธิดารัตน์ ท้าวเดช",
birthday:"18/5/2015",
score:"95",
address:"ชลบุรี",
status:"ผ่าน",
<img src="image/gale.png" class="profile-img"> 
},

"129034":{
memberId:"MB002",
name:"สมหญิง รุ่งเรือง",
birthday:"20 กุมภาพันธ์ 2549",
score:"80",
address:"กรุงเทพมหานคร",
status:"อยู่ระหว่างการตรวจสอบ",
image:"member2.jpg"
},

"888888":{
memberId:"MB003",
name:"วิชัย แสงทอง",
birthday:"12 สิงหาคม 2551",
score:"45",
address:"เชียงใหม่",
status:"ไม่ผ่าน",
image:"member3.jpg"
}

};

function login(){

const password =
document.getElementById("password").value;

const user = users[password];

if(!user){

document.getElementById("error").innerText =
"❌ ไม่พบรหัสสมาชิก";

return;

}

document.getElementById("memberImage").src =
user.image;

document.getElementById("memberName").innerText =
user.name;

document.getElementById("memberId").innerText =
user.memberId;

document.getElementById("birthday").innerText =
user.birthday;

document.getElementById("score").innerText =
user.score;

document.getElementById("address").innerText =
user.address;

const statusBox =
document.getElementById("memberStatus");

statusBox.className = "status";

if(user.status === "ผ่าน"){

statusBox.classList.add("pass");
statusBox.innerHTML =
"✅ ผ่านการตรวจสอบ";

}else if(user.status === "อยู่ระหว่างการตรวจสอบ"){

statusBox.classList.add("pending");
statusBox.innerHTML =
"⏳ อยู่ระหว่างการตรวจสอบ";

}else{

statusBox.classList.add("fail");
statusBox.innerHTML =
"❌ ไม่ผ่าน";

}

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("profilePage")
.classList.remove("hidden");

}

function logout(){

document.getElementById("password").value="";
document.getElementById("error").innerText="";

document.getElementById("profilePage")
.classList.add("hidden");

document.getElementById("loginPage")
.classList.remove("hidden");

}

const targetDate =
new Date("2026-12-31 23:59:59").getTime();

setInterval(function(){

const now = new Date().getTime();

const distance = targetDate - now;

const days =
Math.floor(distance/(1000*60*60*24));

const hours =
Math.floor((distance%(1000*60*60*24))/(1000*60*60));

const minutes =
Math.floor((distance%(1000*60*60))/(1000*60));

const seconds =
Math.floor((distance%(1000*60))/1000);

document.getElementById("countdown")
.innerHTML =
days+" วัน "+
hours+" ชม. "+
minutes+" นาที "+
seconds+" วินาที";

},1000);

</script></body>
</html>
